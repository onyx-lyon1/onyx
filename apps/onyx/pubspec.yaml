name: onyx
description: ade, tomuss Mail pour lyon1

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.0.13+55

environment:
  sdk: ">=3.8.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  modal_bottom_sheet: ^3.0.0-pre
  flutter_bloc: ^9.1.0
  sembast: ^3.6.0
  crypto: ^3.0.6
  path: ^1.9.1
  url_launcher: ^6.1.14
  path_provider: ^2.1.1
  animations: ^3.0.0
  auto_size_text: ^3.0.0
  responsive_sizer: ^3.3.1
  desktop_window: ^0.4.0
  # internationalization
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_localized_locales: ^2.0.5

  #agenda
  lyon1agendaclient: ^1.0.8

  #agenda_config
  qr_code_dart_scan: ^0.14.0
  permission_handler: ^13.0.1

  #izly
  izlyclient: ^1.0.9
  screen_brightness: ^2.0.0+2

  #mail
  lyon1mailclient: ^1.0.10
  webview_flutter: ^4.4.1
  file_picker: ^12.1.0
  open_filex: ^4.3.4
  flutter_file_dialog: ^3.3.2
  flutter_quill: ^11.1.0
  vsc_quill_delta_to_html: ^1.0.3
  enough_mail: ^2.1.7

  #cas
  lyon1casclient: ^1.0.7

  #tomuss
  lyon1tomussclient: ^1.0.10
  screenshot: ^3.0.0
  share_plus: ^13.3.0

  #map
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  geolocator_android: ^5.0.2
  cached_network_image: ^3.3.0
  flutter_map: ^8.3.1
  flutter_map_location_marker: ^10.3.0
  flutter_map_animations: ^0.10.0
  flutter_map_marker_cluster: ^8.2.2
  flutter_map_cache: ^2.0.0+1
  flutter_map_marker_popup: ^8.1.1
  http_cache_hive_store: ^5.0.1
  requests_plus: ^4.8.5

  #authentication
  connectivity_plus: ^7.0.0

  #notifications
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: main
  flutter_local_notifications: ^22.3.0

  #settings
  drag_and_drop_lists:
    git: https://github.com/onyx-lyon1/DragAndDropLists.git
  equatable: ^2.0.5
  biometric_storage: ^6.0.0-dev.5
  logger: ^2.0.2+1
  json_theme_plus: ^7.0.0

  #colloscope
  polytechcolloscopeclient: ^1.0.9
  diacritic: ^0.1.5

  #examen
  lyon1examenclient: ^1.0.0
  dart_mappable: ^4.6.0
  home_widget: ^0.9.3
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  flutter_launcher_icons: ^0.14.4
  test: ^1.24.9
  dart_mappable_builder: ^4.6.0

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/batiment_lyon1.json
    - assets/discord_Logo.png
    - assets/icon_transparent.png
    - assets/iv.txt
    - assets/key.txt
    - assets/izly.png
    - assets/izly_mock_qr-code.png
    - assets/key.txt
    - assets/colloscope_ids.enc
    - assets/stop_words/

  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
